        <div id="test">

                <form id="regForm" action="https://formsubmit.co/g.schomacker@icloud.com" method="POST">

                    <div class="tab">
                        <p><input placeholder="Ich wünsche mir..." id="frage" oninput="this.className = ''"></p>

                    <div class="tab">

                    </div>

                    <div style="overflow:auto;">
                        <div style="float:right;">
                        <button type="button" id="prevBtn" onclick="nextPrev(-1)">Zurück</button>
                        <button type="button" id="nextBtn" onclick="nextPrev(1)">Weiter</button>
                        </div>
                    </div>

                    <div style="text-align:center;margin-top:40px;">
                        <span class="step"></span>
                        <span class="step"></span>
                        <span class="step"></span>
                        <span class="step"></span>
                      </div>

                </form>
            </div>
        </div>
    </div>

    <div>
        
    </div>

            <button class="help">Antworten</button><br>

    <div id="new">

    </div>

            </div>
        </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@v0.149.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.149.0/examples/jsm/"
